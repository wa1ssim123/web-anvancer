name: HORENOVA production verification
on:
  push:
    branches: [horenova-free-deploy-2026]
    paths: [.github/workflows/horenova-production-verification.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  production-check:
    runs-on: ubuntu-latest
    steps:
      - name: Verify deployed HORENOVA mobile fix on public domain
        shell: bash
        run: |
          set -euo pipefail
          # CDN may need a moment to expose a just-published static build.
          for i in $(seq 1 10); do
            curl -fsSL --connect-timeout 8 --max-time 18 "https://horenova.com/?deploycheck=${GITHUB_RUN_ID}-${i}" -o /tmp/home
            if grep -q 'hn-ios-motion' /tmp/home && grep -q 'safari-motion-20261112-8' /tmp/home; then break; fi
            sleep 6
          done
          grep -q 'hn-ios-motion' /tmp/home
          grep -q 'safari-motion-20261112-8' /tmp/home
          curl -fsSL --connect-timeout 8 --max-time 22 "https://horenova.com/horenova-home-film.js?deploycheck=${GITHUB_RUN_ID}" -o /tmp/film.js
          grep -q 'fitIntroHeading' /tmp/film.js
          grep -q 'hn-ios-loop-active' /tmp/film.js
          curl -fsSL --connect-timeout 8 --max-time 25 "https://horenova.com/horenova-home-film.css?deploycheck=${GITHUB_RUN_ID}" -o /tmp/film.css
          grep -q 'iPhone Safari low-power-safe cinematic intro' /tmp/film.css
          curl -fsSL --connect-timeout 8 --max-time 45 "https://horenova.com/assets/horenova-cinema-mobile.webp?deploycheck=${GITHUB_RUN_ID}" -o /tmp/loop.webp
          python - <<'PY'
          from pathlib import Path
          p=Path('/tmp/loop.webp')
          data=p.read_bytes()
          assert data[:4]==b'RIFF' and data[8:12]==b'WEBP'
          assert b'ANIM' in data and data.count(b'ANMF')>=30
          print('PASS moving mobile animation',p.stat().st_size,'bytes,',data.count(b'ANMF'),'frames')
          PY
          echo 'PASS: HORENOVA official domain serves new mobile layout, film controller and moving Safari fallback'
