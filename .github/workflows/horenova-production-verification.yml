name: HORENOVA production verification
on:
  push:
    branches: [horenova-free-deploy-2026]
    paths: [.github/workflows/horenova-production-verification.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  production-check:
    runs-on: ubuntu-latest
    steps:
      - name: Verify deployed HORENOVA mobile fix on public domain
        shell: bash
        run: |
          set -euxo pipefail
          echo 'Production verification: request live files and print exact failing step'
          # CDN may need a moment to expose a just-published static build.
          for i in $(seq 1 10); do
            curl -fsSL --connect-timeout 8 --max-time 18 "https://horenova.com/?deploycheck=${GITHUB_RUN_ID}-${i}" -o /tmp/home
            if grep -q 'hn-ios-motion' /tmp/home && grep -q 'fullframe-20261112-2' /tmp/home; then break; fi
            sleep 6
          done
          grep -q 'hn-ios-motion' /tmp/home
          grep -q 'fullframe-20261112-2' /tmp/home
          curl -fsSL --connect-timeout 8 --max-time 22 "https://horenova.com/horenova-home-film.js?deploycheck=${GITHUB_RUN_ID}" -o /tmp/film.js
          grep -q 'fitIntroHeading' /tmp/film.js
          grep -q 'hn-ios-loop-active' /tmp/film.js
          curl -fsSL --connect-timeout 8 --max-time 25 "https://horenova.com/horenova-home-film.css?deploycheck=${GITHUB_RUN_ID}" -o /tmp/film.css
          wc -c /tmp/home /tmp/film.js /tmp/film.css
          grep -q 'Fixed-frame GIF renderer' /tmp/film.css
          grep -q 'horenova-cinema-mobile.gif' /tmp/home
          curl -fsSL --connect-timeout 8 --max-time 45 "https://horenova.com/assets/horenova-cinema-mobile.gif?deploycheck=${GITHUB_RUN_ID}" -o /tmp/loop.gif
          python - <<'PY'
          from pathlib import Path
          p=Path('/tmp/loop.gif')
          data=p.read_bytes()
          assert data[:6] in (b'GIF87a',b'GIF89a'), 'Not a GIF'
          assert len(data)>500000, 'Animation too small'
          print('PASS complete-frame GIF on the official domain',p.stat().st_size,'bytes')
          PY
          echo 'PASS: HORENOVA official domain serves new mobile layout, film controller and moving Safari fallback'
