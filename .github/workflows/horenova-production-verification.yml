name: HORENOVA production verification
on:
  push:
    branches: [horenova-free-deploy-2026]
    paths: [.github/workflows/horenova-production-verification.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  production-check:
    runs-on: ubuntu-latest
    steps:
      - name: Verify mobile 1080p 30fps video on official domain
        shell: bash
        run: |
          set -euxo pipefail
          for i in $(seq 1 10); do
            curl -fsSL --connect-timeout 8 --max-time 18 "https://horenova.com/?deploycheck=${GITHUB_RUN_ID}-${i}" -o /tmp/home
            if grep -q 'ios-mp4-20261112-a' /tmp/home; then break; fi
            sleep 6
          done
          grep -q 'horenova-mobile-tourism-poster.jpg' /tmp/home
          grep -q 'horenova-mobile-video-fix.css' /tmp/home
          grep -q 'ios-mp4-20261112-a' /tmp/home
          if grep -q 'src="/assets/horenova-cinema-mobile-hq.webp' /tmp/home; then
            echo 'FAIL: old animated WebP still preloaded';exit 1
          fi
          curl -fsSL --connect-timeout 8 --max-time 20 "https://horenova.com/horenova-home-film.js?deploycheck=${GITHUB_RUN_ID}" -o /tmp/film.js
          grep -q 'horenova-mobile-cinema-1080p30.mp4' /tmp/film.js
          grep -q 'Activer la vidéo HD' /tmp/film.js
          curl -fsSL --connect-timeout 8 --max-time 20 "https://horenova.com/horenova-mobile-video-fix.css?deploycheck=${GITHUB_RUN_ID}" -o /tmp/film.css
          grep -q 'only after mobile JS adds hn-ios-loop-active' /tmp/film.css
          curl -fsSL --connect-timeout 8 --max-time 45 "https://horenova.com/assets/horenova-mobile-cinema-1080p30.mp4?deploycheck=${GITHUB_RUN_ID}" -o /tmp/video.mp4
          curl -fsSL --connect-timeout 8 --max-time 20 "https://horenova.com/assets/horenova-mobile-tourism-poster.jpg?deploycheck=${GITHUB_RUN_ID}" -o /tmp/poster.jpg
          python - <<'PY'
          from pathlib import Path
          m=Path('/tmp/video.mp4').read_bytes()
          p=Path('/tmp/poster.jpg').read_bytes()
          assert b'ftyp' in m[:32] and len(m)>1_500_000
          assert p[:3]==b'\xff\xd8\xff' and len(p)>100_000
          print('PASS public-domain mobile 1080p H264 video bytes:',len(m),'poster bytes:',len(p))
          PY
          echo 'PASS official HORENOVA uses hardware-accelerated video and still-photo fallback instead of heavy WebP animation'
