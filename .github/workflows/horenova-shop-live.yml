name: Verify HORENOVA real uniforms Shop on public domain
on:
  push:
    branches: [horenova-free-deploy-2026]
    paths:
      - shop.html
      - shop-product.html
      - shop-v17.js
      - horenova-showroom.js
      - horenova-shop-real.css
      - .github/workflows/horenova-shop-live.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  shop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax and content checks
        run: |
          node --check horenova-showroom.js
          node --check shop-v17.js
          grep -q "hx-showroom" shop.html
          grep -q "horenova-shop-real.css" shop.html
          grep -q "wincous.com/cdn/shop" horenova-showroom.js
          grep -q "chefworks.co.jp/cdn/shop" horenova-showroom.js
          grep -q "Vue dos indisponible" horenova-showroom.js
          grep -q "hx-photo--dual" horenova-shop-real.css
          ! grep -q 'function shape(p,back)' horenova-showroom.js
      - name: Check live publication
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 18); do
            curl -fsSL --connect-timeout 10 --max-time 25 "https://horenova.com/shop.html?check=${GITHUB_RUN_ID}-${i}" -o /tmp/shop.html || true
            curl -fsSL --connect-timeout 10 --max-time 25 "https://horenova.com/horenova-showroom.js?check=${GITHUB_RUN_ID}-${i}" -o /tmp/showroom.js || true
            if grep -q 'real-photos-gold-20261113-c' /tmp/shop.html && grep -q 'wincous.com/cdn/shop' /tmp/showroom.js; then break; fi
            sleep 8
          done
          grep -q 'real-photos-gold-20261113-c' /tmp/shop.html
          grep -q 'wincous.com/cdn/shop' /tmp/showroom.js
          echo 'PASS: real photographic HORENOVA showroom is published'
