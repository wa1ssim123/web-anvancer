name: HORENOVA mobile — iOS simulator preflight
on:
  workflow_dispatch:
  push:
    branches:
      - release/horenova-mobile-stores-2026
    paths:
      - '.github/workflows/horenova-ios-preflight.yml'
      - 'mobile/**'
      - 'shop.html'
      - 'shop-v17.js'
      - 'horenova-wardrobe-26.js'
      - 'horenova-wardrobe-26.css'
permissions:
  contents: read
jobs:
  ios-simulator:
    runs-on: macos-26
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm Xcode version
        run: xcodebuild -version
      - name: Prepare HORENOVA web bundle
        working-directory: mobile
        run: |
          npm install --no-audit --no-fund
          npm run build:web
          npm run check
      - name: Generate unsigned native iOS project and icons
        working-directory: mobile
        run: |
          npx cap add ios
          npx capacitor-assets generate --ios
          npx cap sync ios
      - name: Compile iOS Simulator (no Apple signing)
        working-directory: mobile
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
      - name: Upload unsigned iOS Xcode source
        uses: actions/upload-artifact@v4
        with:
          name: HORENOVA-iOS-Xcode-SOURCE-Not-App-Store-IPA
          path: mobile/ios/
          if-no-files-found: error
          retention-days: 14
