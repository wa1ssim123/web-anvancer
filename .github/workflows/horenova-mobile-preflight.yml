name: HORENOVA mobile — Android debug preflight
on:
  workflow_dispatch:
  push:
    branches:
      - release/horenova-mobile-stores-2026
    paths:
      - 'mobile/**'
      - '.github/workflows/horenova-mobile-preflight.yml'
permissions:
  contents: read
jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies and build website
        working-directory: mobile
        run: |
          npm install --no-audit --no-fund
          npm run build:web
          npm run check
      - name: Install Android SDK API 36 with preinstalled commandline tools
        run: |
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - name: Generate native Android project
        working-directory: mobile
        run: |
          npx cap add android
          npx capacitor-assets generate --android
          npx cap sync android
      - name: Build Android debug test APK
        working-directory: mobile/android
        run: chmod +x gradlew && ./gradlew --no-daemon assembleDebug
      - name: Preserve test APK
        uses: actions/upload-artifact@v4
        with:
          name: HORENOVA-Android-DEBUG-Not-For-Play-Store
          path: mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
