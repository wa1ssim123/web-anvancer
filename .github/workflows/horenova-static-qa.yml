name: HORENOVA release checks
on:
  push:
    branches:
      - horenova-free-deploy-2026
  workflow_dispatch:
jobs:
  source-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check scripts, resources, translations and role gates
        run: node qa/site-audit.cjs
      - name: Simulate candidate, recruiter and administrator permissions
        run: node --test qa/roles.test.cjs
      - name: Security test historical Wix statistics, protected counts and anonymous session deduplication
        run: node --test qa/analytics.test.cjs
      - name: Exercise adversarial cross-account PostgreSQL and Wix API simulations
        run: node qa/horenova-runtime-gates.cjs
      - name: Verify recruiter and candidate onboarding isolation
        run: node qa/horenova-role-gates.cjs
      - name: Audit production backend dependencies for high-severity vulnerabilities
        run: |
          npm install --prefix backend --package-lock-only --ignore-scripts --no-audit
          npm audit --prefix backend --omit=dev --audit-level=high
      - name: Verify private chats, protected matching search and consent-based three-way conversations
        run: node --test qa/recruitment-chat.test.cjs
      - name: Test HORENOVA TECH multi-venue authorization and atomic POS inventory transactions
        run: node --test qa/tech-api.test.cjs

      - name: Test dynamic French, English and Arabic updates
        run: node qa/i18n-dynamic.cjs
      - name: Test all transactional confirmations, GIFs and email retry safety
        run: node qa/transactional-email.cjs
  browser-smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test runner
        run: npm install --no-save playwright
      - name: Install headless Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Exercise FR, AR and EN on public pages
        run: node qa/browser-smoke.cjs
      - name: Exhaustively open all application pages on small phones, phones and desktop
        run: node qa/full-app-stress.cjs
      - name: Verify admin analytics interface and Wix historical registration totals on mobile in all languages
        run: node qa/admin-analytics-browser.cjs
      - name: Prove malicious vacancy and talent HTML never executes in the browser
        run: node qa/xss-injection-browser.cjs
      - name: Verify mobile layout, readability, support and role dashboards
        run: node qa/adaptive-layout.cjs
      - name: Verify compact support button and single-row role navigation
        run: node qa/support-fab-layout.cjs
      - name: Test 24-hour support intake, immediate private chat and administrator inbox
        run: node qa/support-direct.cjs
      - name: Verify professional shared jobs and shift pages on mobile
        run: node qa/opportunity-detail-layout.cjs
      - name: Check admin dossier details and moderation buttons on mobile
        run: node qa/admin-case-layout.cjs
      - name: Verify admin A4 printing of full candidate, job/shift and support case records
        run: node qa/admin-print-browser.cjs
      - name: Test recruiter list mobile scrolling and confirmed deletion of jobs and shifts
        run: node qa/admin-deletion-scroll.cjs
      - name: Check email verification, existing-account recovery, and shared-offer continuation
        run: node qa/candidate-journey.cjs
      - name: Test direct candidature with private photo and FR EN AR
        run: node qa/easy-apply-browser.cjs
      - name: Check multilingual career quiz with preserved answers
        run: node qa/candidate-i18n-quiz.cjs
      - name: Test Shop and Academy gateways and Morocco–Canada story on mobile in FR EN AR
        run: node qa/home-brand-story.cjs
      - name: Test HORENOVA A-to-Z matching guide, navigation and RTL on phones and PC
        run: node qa/matching-guide.cjs
      - name: Verify HORENOVA TECH storefront, local POS inventory and NFC menu in FR EN AR
        run: node qa/tech-system.cjs
      - name: Verify HORENOVA private inbox for candidate, recruiter and admin on mobile and desktop
        run: node qa/chat-browser.cjs
      - name: Exercise authenticated TECH PRO pilot console on mobile with mock server
        run: node qa/tech-console-browser.cjs
      - name: Verify candidate, job and shift email visual layout across 3 languages
        run: node qa/email-visual.cjs
      - name: Verify the real horenova.com and Render pages show the current support and admin printing release
        run: node qa/live-domain-release.cjs
      - name: Verify live Horenova Tech storefront, Pro UI, public menu and protected API
        run: node qa/live-tech-release.cjs
      - name: Verify live private recruitment inbox and access-protected matching APIs
        run: node qa/live-chat-release.cjs
      - name: Verify deployed anti-clickjacking headers, CORS and protected routes without writes
        run: node qa/live-security-release.cjs
      - name: Diagnose actual support artwork and header position on mobile
        run: node qa/live-support-dom.cjs
