name: HORENOVA — release gates
on:
  push:
    branches:
      - horenova-free-deploy-2026
    paths:
      - 'qa/horenova-release-gates.cjs'
      - 'qa/horenova-runtime-gates.cjs'
      - 'qa/horenova-talents-gates.cjs'
      - 'qa/horenova-role-gates.cjs'
      - 'onboarding.js'
      - 'onboarding.html'
      - 'account.js'
      - 'account.html'
      - 'mihna-global.js'
      - 'mobile-nav-v15.js'
      - 'backend/server.cjs'
      - 'app.js'
      - 'live-data.js'
      - 'recruit-live.js'
      - 'recruiter-setup.html'
      - 'recruiter-setup.js'
      - 'enter.html'
      - 'mot-de-passe-oublie.html'
      - 'shop.html'
      - 'admin.js'
      - 'hn-api.js'
      - 'job.html'
      - 'recruit.html'
      - 'admin.html'
      - 'apply.html'
      - 'admin-overview.js'
      - 'candidate-setup.js'
      - 'apply.js'
      - '.github/workflows/horenova-core-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify code syntax, role isolation and public vacancy wiring
        run: |
          node qa/horenova-release-gates.cjs
          node qa/horenova-runtime-gates.cjs
          node qa/horenova-talents-gates.cjs
          node qa/horenova-role-gates.cjs
