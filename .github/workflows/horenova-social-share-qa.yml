name: HORENOVA — Social Share iPhone QA
on:
  push:
    branches: [horenova-free-deploy-2026]
    paths:
      - social-publications-admin.js
      - social-promo-share.js
      - social-publications-admin.css
      - admin-social-mobile-fix.css
      - qa/social-publications-browser.cjs
      - social-brand-icons.js
      - social-brand-icons.css
      - assets/brand-whatsapp.svg
      - assets/brand-telegram.svg
      - qa/brand-social-icons-browser.cjs
      - communaute.html
      - index.html
      - channel-admin.js
      - telegram-admin.js
      - pwa-register.js
      - tech.html
      - .github/workflows/horenova-social-share-qa.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  social-iphone:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test runner
        run: npm install --no-save playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify social messages and independent text/image clipboard
        run: node qa/social-publications-browser.cjs
      - name: Verify real WhatsApp and Telegram logos in public/admin UI
        run: node qa/brand-social-icons-browser.cjs
