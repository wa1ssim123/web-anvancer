name: HORENOVA — Social Share iPhone QA
on:
  push:
    branches: [horenova-free-deploy-2026]
    paths:
      - social-publications-admin.js
      - social-promo-share.js
      - social-publications-admin.css
      - admin-social-mobile-fix.css
      - qa/social-publications-browser.cjs
      - .github/workflows/horenova-social-share-qa.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  social-iphone:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test runner
        run: npm install --no-save playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify contrast, channel navigation, random poster and combined clipboard
        run: node qa/social-publications-browser.cjs
