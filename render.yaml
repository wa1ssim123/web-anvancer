services:
  - type: web
    name: horenova-site-officiel
    runtime: static
    repo: https://github.com/wa1ssim123/web-anvancer
    branch: horenova-free-deploy-2026
    buildCommand: echo 'HORENOVA frontend static deployment'
    staticPublishPath: .
    autoDeployTrigger: commit
    domains:
      - horenova.com
    headers:
      - path: /shop.html
        name: Cache-Control
        value: "no-cache, no-store, must-revalidate"
      - path: /horenova-wardrobe-atelier-20261113.js
        name: Cache-Control
        value: "no-cache, must-revalidate"
      - path: /shop-products-atelier-20261113.js
        name: Cache-Control
        value: "no-cache, must-revalidate"
      - path: /horenova-shop-atelier-20261113.css
        name: Cache-Control
        value: "no-cache, must-revalidate"
