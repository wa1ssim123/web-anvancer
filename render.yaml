services:
  - type: web
    name: horenova-site-officiel
    runtime: static
    repo: https://github.com/wa1ssim123/web-anvancer
    branch: horenova-free-deploy-2026
    buildCommand: echo 'HORENOVA frontend static deployment'
    staticPublishPath: .
    autoDeployTrigger: commit
    domains:
      - horenova.com
    headers:
      # All HTML/JS/CSS must be revalidated; long-lived copies caused role-specific stale dashboards.
      - path: /*
        name: Cache-Control
        value: "no-store, max-age=0, must-revalidate"
      - path: /*
        name: X-Content-Type-Options
        value: "nosniff"
      - path: /*
        name: Referrer-Policy
        value: "strict-origin-when-cross-origin"
